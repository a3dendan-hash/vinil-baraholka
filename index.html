<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Винил рядом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#12262e;--card:#1b3640;--ink:#f3ece0;--mute:#8fa8ad;--acc:#f0b43c;--acc-ink:#251a00;--line:#2b4a55;--bad:#ff8a7a;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not(.tg-dark){--bg:#f1ede4;--card:#fff;--ink:#1d2a2e;--mute:#6c7f83;--line:#ddd6c8;--acc-ink:#251a00;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
body{padding:0 14px calc(76px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px);max-width:640px;margin:auto}
h1{font-size:26px;font-weight:800;padding:16px 0 10px;letter-spacing:-.02em}
h2{font-size:19px;font-weight:800;margin:0 0 6px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row{display:flex;gap:8px}.row>*{flex:1}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar input{flex:1}.bar .btn{flex:none}
.card{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.cov{width:76px;height:76px;flex:none;border-radius:8px;background:radial-gradient(circle,var(--bg) 0 8%,#000 9% 30%,#222 31% 33%,#000 34% 100%) center/cover;object-fit:cover}
.big{width:100%;height:auto;aspect-ratio:1;border-radius:14px;margin-bottom:12px}
.meta{color:var(--mute);font-size:13px}.price{font-weight:800;color:var(--acc);font-size:17px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;margin:4px 4px 0 0}
.tag.c{border-color:var(--acc);color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:14px 4px;color:var(--mute);font-weight:600;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 2px var(--acc)}
.empty{color:var(--mute);text-align:center;padding:32px 10px}
.err{color:var(--bad);padding:10px 0}
details{margin:0 0 12px}summary{cursor:pointer;color:var(--mute);padding:4px 0}
ol.tr{padding-left:22px;color:var(--mute);font-size:14px}ol.tr li b{font-weight:400;color:var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}
</style>
</head>
<body>
<h1 id="ttl">Винил рядом</h1>

<section id="v-search">
  <form class="bar" id="sf"><input id="q" type="search" placeholder="Название, артист или код (r1234567, каталожный №)" enterkeyhint="search"><button class="btn">Найти</button></form>
  <div id="sres"></div>
</section>

<section id="v-market" class="hide">
  <div class="bar"><input id="mq" type="search" placeholder="Поиск по объявлениям"><button class="btn alt" id="ftog">Фильтры</button></div>
  <div id="flt" class="hide">
    <div class="row"><div><label>Цена от</label><input id="pmin" type="number" min="0"></div><div><label>Цена до</label><input id="pmax" type="number" min="0"></div></div>
    <div class="row"><div><label>Год от</label><input id="ymin" type="number"></div><div><label>Год до</label><input id="ymax" type="number"></div></div>
    <div class="row"><div><label>Мин. состояние</label><select id="fcond"></select></div><div><label>Город</label><input id="fcity"></div></div>
    <div class="row"><div><label>Жанр</label><input id="fgen"></div><div><label>Сортировка</label><select id="fsort"><option value="new">Сначала новые</option><option value="pa">Дешевле</option><option value="pd">Дороже</option><option value="y">По году</option></select></div></div>
    <div style="height:12px"></div>
  </div>
  <div id="mres"></div>
</section>

<section id="v-mine" class="hide"><div id="mine"></div>
  <details><summary>Настройки и токен Discogs</summary>
    <label>Персональный токен Discogs</label><input id="tok" type="password" autocomplete="off" placeholder="Вставьте токен">
    <p class="meta" style="margin:6px 0 10px">Получить: discogs.com → Settings → Developers → Generate new token. Токен хранится только на вашем устройстве.</p>
    <div class="row"><button class="btn" id="savetok">Сохранить</button><button class="btn bad" id="deltok">Удалить токен</button></div>
  </details>
</section>

<nav><button data-v="search" class="on">Поиск</button><button data-v="market">Маркет</button><button data-v="mine">Мои</button></nav>
<div id="sheet" class="sheet hide"><div id="sbody"></div></div>

<script>
// ===== Настройки =====
// Для общего маркета между пользователями укажите адрес вашего сервера (см. API ниже).
// GET {B}/listings → [..]; POST {B}/listings; DELETE {B}/listings/:id. Заголовок X-Init-Data = Telegram initData для проверки.
const BACKEND_URL = "";
const COND = ["M","NM","VG+","VG","G+","G","F","P"];
const COND_NAME = {M:"Mint",NM:"Near Mint","VG+":"Very Good Plus",VG:"Very Good","G+":"Good Plus",G:"Good",F:"Fair",P:"Poor"};
const API = "https://api.discogs.com";

const tg = window.Telegram && Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); if(tg.colorScheme==="dark") document.documentElement.classList.add("tg-dark"); }
const me = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ===== Хранилище (токен и мои объявления) =====
const store = {
  get(k){ return new Promise(r=>{ try{ if(tg&&tg.CloudStorage){ tg.CloudStorage.getItem(k,(e,v)=>r(e?localStorage.getItem(k):v||localStorage.getItem(k))); return; } }catch(e){} r(localStorage.getItem(k)); }); },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} try{ tg&&tg.CloudStorage&&tg.CloudStorage.setItem(k,v); }catch(e){} },
  del(k){ try{localStorage.removeItem(k)}catch(e){} try{ tg&&tg.CloudStorage&&tg.CloudStorage.removeItem(k); }catch(e){} }
};
let token = "", mine = [], all = [];

// ===== Discogs =====
async function dg(path, params={}){
  if(!token) throw new Error("Добавьте токен Discogs: вкладка «Мои» → Настройки.");
  const u = new URL(API+path); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); u.searchParams.set("token",token);
  const r = await fetch(u);
  if(r.status===401) throw new Error("Токен не подошёл. Проверьте его в настройках.");
  if(r.status===404) throw new Error("Ничего не найдено по этому коду.");
  if(r.status===429) throw new Error("Слишком много запросов. Подождите минуту.");
  if(!r.ok) throw new Error("Ошибка Discogs: "+r.status);
  return r.json();
}
function parseCode(s){
  s = s.trim(); let m = s.match(/discogs\.com\/.*?release\/(\d+)/i) || s.match(/^\[?r(\d+)\]?$/i) || s.match(/^(\d{3,})$/);
  return m ? m[1] : null;
}
async function search(){
  const q = $("#q").value.trim(); if(!q) return;
  const box = $("#sres"); box.innerHTML = '<p class="empty">Ищу…</p>';
  try{
    const id = parseCode(q);
    if(id){ box.innerHTML=""; return openRelease(id); }
    const d = await dg("/database/search",{q, type:"release", per_page:25});
    if(!d.results.length){ box.innerHTML='<p class="empty">Ничего не нашлось. Попробуйте другое название или каталожный номер.</p>'; return; }
    box.innerHTML = d.results.map(r=>`<div class="card" data-id="${r.id}"><img class="cov" loading="lazy" src="${esc(r.thumb)}" alt="" onerror="this.removeAttribute('src')"><div><b>${esc(r.title)}</b><div class="meta">${esc([r.year,r.country,(r.format||[]).join(", ")].filter(Boolean).join(" · "))}</div><div class="meta">${esc([(r.label||[])[0],r.catno].filter(Boolean).join(" · "))}</div></div></div>`).join("");
    box.querySelectorAll(".card").forEach(c=>c.onclick=()=>openRelease(c.dataset.id));
  }catch(e){ box.innerHTML=`<p class="err">${esc(e.message)}</p>`; }
}
async function openRelease(id){
  openSheet('<p class="empty">Загружаю…</p>');
  try{
    const r = await dg("/releases/"+id);
    const img = (r.images||[]).find(i=>i.type==="primary")||(r.images||[])[0];
    const art = (r.artists||[]).map(a=>a.name.replace(/\s\(\d+\)$/,"")).join(", ");
    const lab = (r.labels||[]).map(l=>l.name+(l.catno?" ("+l.catno+")":"")).join(", ");
    const fmt = (r.formats||[]).map(f=>[f.name,...(f.descriptions||[])].join(", ")).join("; ");
    const info = {releaseId:r.id,artist:art,title:r.title,year:r.year||0,country:r.country||"",label:lab,genre:(r.genres||[]).join(", "),styles:(r.styles||[]).join(", "),format:fmt,cover:(img&&(img.uri150||img.resource_url))||r.thumbnail||""};
    const listed = all.filter(l=>l.releaseId===r.id);
    $("#sbody").innerHTML = `
      ${img?`<img class="cov big" src="${esc(img.uri||img.resource_url)}" alt="">`:""}
      <h2>${esc(art)} — ${esc(r.title)}</h2>
      <div class="meta">${esc([r.year,r.country,fmt].filter(Boolean).join(" · "))}</div>
      <div class="meta">${esc(lab)}</div>
      <div>${[...(r.genres||[]),...(r.styles||[])].map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <p class="meta" style="margin-top:8px">В коллекциях: ${r.community?.have??"—"} · В вишлистах: ${r.community?.want??"—"}${r.lowest_price?` · Минимум на Discogs: $${r.lowest_price}`:""}</p>
      ${r.notes?`<details><summary>Заметки</summary><p class="meta" style="white-space:pre-wrap">${esc(r.notes.slice(0,800))}</p></details>`:""}
      ${(r.tracklist||[]).length?`<details open><summary>Треклист</summary><ol class="tr">${r.tracklist.filter(t=>t.title).map(t=>`<li><b>${esc((t.position?t.position+" ":"")+t.title)}</b> ${esc(t.duration||"")}</li>`).join("")}</ol></details>`:""}
      <p class="meta">Идентификаторы: ${esc((r.identifiers||[]).slice(0,4).map(i=>i.value).join(" · ")||"—")}</p>
      <h2 style="margin-top:14px">Объявления (${listed.length})</h2>
      <div id="rl">${listed.map(cardHtml).join("")||'<p class="empty">Пока никто не продаёт эту пластинку.</p>'}</div>
      <div class="row" style="margin-top:8px"><button class="btn" id="sellb">Продать эту пластинку</button><button class="btn alt" id="clb">Закрыть</button></div>`;
    bindCards($("#rl"));
    $("#sellb").onclick = ()=>sellForm(info);
    $("#clb").onclick = closeSheet;
  }catch(e){ $("#sbody").innerHTML=`<p class="err">${esc(e.message)}</p><button class="btn alt" onclick="closeSheet()">Закрыть</button>`; }
}

// ===== Объявления =====
const cur = {RUB:"₽",USD:"$",EUR:"€",KZT:"₸",BYN:"Br"};
function cardHtml(l){
  return `<div class="card" data-l="${esc(l.id)}"><img class="cov" loading="lazy" src="${esc(l.cover)}" alt="" onerror="this.removeAttribute('src')"><div style="min-width:0"><b>${esc(l.artist)} — ${esc(l.title)}</b><div class="meta">${esc([l.year||"",l.country,l.city].filter(Boolean).join(" · "))}</div><div><span class="tag c">${esc(l.media)}${l.sleeve?" / "+esc(l.sleeve):""}</span></div><div class="price">${esc(l.price)} ${cur[l.cur]||esc(l.cur)}</div></div></div>`;
}
function bindCards(root){ root.querySelectorAll("[data-l]").forEach(c=>c.onclick=()=>listingView(c.dataset.l)); }
function find(id){ return all.find(l=>l.id===id)||mine.find(l=>l.id===id); }
function listingView(id){
  const l = find(id); if(!l) return;
  const own = me && l.sellerId===me.id || mine.some(m=>m.id===id);
  openSheet(`
    <img class="cov big" src="${esc(l.cover)}" alt="" onerror="this.removeAttribute('src')">
    <h2>${esc(l.artist)} — ${esc(l.title)}</h2>
    <div class="price" style="font-size:22px">${esc(l.price)} ${cur[l.cur]||esc(l.cur)}</div>
    <p class="meta">${esc([l.year,l.country,l.label,l.format].filter(Boolean).join(" · "))}</p>
    <div><span class="tag c">Диск: ${esc(l.media)} (${COND_NAME[l.media]||""})</span>${l.sleeve?`<span class="tag c">Конверт: ${esc(l.sleeve)}</span>`:""}${l.city?`<span class="tag">${esc(l.city)}</span>`:""}${l.genre?`<span class="tag">${esc(l.genre)}</span>`:""}</div>
    ${l.note?`<p style="margin-top:10px;white-space:pre-wrap">${esc(l.note)}</p>`:""}
    <p class="meta" style="margin-top:10px">Продавец: ${esc(l.sellerName||"—")}</p>
    <div class="row" style="margin-top:12px">
      ${own?`<button class="btn bad" id="dl">Снять с продажи</button>`:`<button class="btn" id="cs">Сообщить продавцу</button>`}
      <button class="btn alt" id="rel">О пластинке</button><button class="btn alt" id="clb">Закрыть</button>
    </div>`);
  $("#clb").onclick = closeSheet; $("#rel").onclick = ()=>openRelease(l.releaseId);
  if($("#cs")) $("#cs").onclick = ()=>contact(l);
  if($("#dl")) $("#dl").onclick = ()=>removeListing(l);
}
function contact(l){
  if(!l.sellerUsername){ alert("У продавца нет публичного @username в Telegram — написать ему не получится."); return; }
  const text = encodeURIComponent(`Здравствуйте! Интересует пластинка: ${l.artist} — ${l.title} (${l.year||"?"}, ${l.media}), ${l.price} ${l.cur}. Ещё продаёте?`);
  const url = `https://t.me/${l.sellerUsername}?text=${text}`;
  tg&&tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,"_blank");
}
function sellForm(info){
  if(!me){ alert("Откройте приложение внутри Telegram, чтобы размещать объявления."); return; }
  const opts = COND.map(c=>`<option>${c}</option>`).join("");
  $("#sbody").innerHTML = `<h2>${esc(info.artist)} — ${esc(info.title)}</h2>
    <div class="row"><div><label>Цена</label><input id="fp" type="number" min="0" inputmode="decimal"></div><div><label>Валюта</label><select id="fc"><option>RUB</option><option>USD</option><option>EUR</option><option>KZT</option><option>BYN</option></select></div></div>
    <div class="row"><div><label>Состояние диска</label><select id="fm">${opts}</select></div><div><label>Состояние конверта</label><select id="fs"><option value="">—</option>${opts}</select></div></div>
    <label>Город</label><input id="fci" placeholder="Например, Москва">
    <label>Год выпуска (если у вас другой пресс)</label><input id="fy" type="number" value="${info.year||""}">
    <label>Комментарий (пресс, матрицы, доставка)</label><textarea id="fn" rows="3"></textarea>
    ${me.username?"":'<p class="err">В вашем профиле нет @username — покупатели не смогут написать вам. Задайте его в настройках Telegram.</p>'}
    <div class="row" style="margin-top:12px"><button class="btn" id="pub">Опубликовать</button><button class="btn alt" id="cn">Отмена</button></div>`;
  $("#cn").onclick = closeSheet;
  $("#pub").onclick = async ()=>{
    const price = parseFloat($("#fp").value); if(!(price>0)){ alert("Укажите цену."); return; }
    const l = {...info, id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), price, cur:$("#fc").value, media:$("#fm").value, sleeve:$("#fs").value, city:$("#fci").value.trim(), year:parseInt($("#fy").value)||info.year, note:$("#fn").value.trim(), sellerId:me.id, sellerName:[me.first_name,me.last_name].filter(Boolean).join(" "), sellerUsername:me.username||"", ts:Date.now()};
    try{
      if(BACKEND_URL){ const r = await fetch(BACKEND_URL+"/listings",{method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":tg.initData||""},body:JSON.stringify(l)}); if(!r.ok) throw 0; }
      mine.unshift(l); store.set("mine",JSON.stringify(mine)); await loadAll(); closeSheet(); show("mine");
    }catch(e){ alert("Не удалось опубликовать. Проверьте соединение."); }
  };
}
async function removeListing(l){
  if(!confirm("Снять объявление с продажи?")) return;
  try{ if(BACKEND_URL) await fetch(BACKEND_URL+"/listings/"+l.id,{method:"DELETE",headers:{"X-Init-Data":tg.initData||""}}); }catch(e){}
  mine = mine.filter(m=>m.id!==l.id); store.set("mine",JSON.stringify(mine)); await loadAll(); closeSheet(); renderMine(); renderMarket();
}
async function loadAll(){
  if(BACKEND_URL){ try{ all = await (await fetch(BACKEND_URL+"/listings")).json(); }catch(e){ all = mine.slice(); } }
  else all = mine.slice();
}

// ===== Маркет и фильтры =====
function renderMarket(){
  const q = $("#mq").value.toLowerCase().trim(), n = id=>parseFloat($(id).value);
  const pmin=n("#pmin"),pmax=n("#pmax"),ymin=n("#ymin"),ymax=n("#ymax"),fc=$("#fcond").value,city=$("#fcity").value.toLowerCase().trim(),gen=$("#fgen").value.toLowerCase().trim();
  let a = all.filter(l=>
    (!q || (l.artist+" "+l.title+" "+l.label+" "+l.note).toLowerCase().includes(q)) &&
    (isNaN(pmin)||l.price>=pmin) && (isNaN(pmax)||l.price<=pmax) &&
    (isNaN(ymin)||l.year>=ymin) && (isNaN(ymax)||l.year<=ymax) &&
    (!fc || COND.indexOf(l.media)<=COND.indexOf(fc)) &&
    (!city || (l.city||"").toLowerCase().includes(city)) &&
    (!gen || ((l.genre||"")+" "+(l.styles||"")).toLowerCase().includes(gen)));
  const s = $("#fsort").value;
  a.sort(s==="pa"?(x,y)=>x.price-y.price : s==="pd"?(x,y)=>y.price-x.price : s==="y"?(x,y)=>x.year-y.year : (x,y)=>y.ts-x.ts);
  $("#mres").innerHTML = a.length ? a.map(cardHtml).join("") : `<p class="empty">${all.length?"По фильтрам ничего нет. Ослабьте условия.":"Объявлений пока нет. Найдите пластинку и нажмите «Продать»."}</p>`;
  bindCards($("#mres"));
}
function renderMine(){
  $("#mine").innerHTML = (mine.length ? mine.map(cardHtml).join("") : '<p class="empty">У вас нет объявлений. Найдите пластинку во вкладке «Поиск» и нажмите «Продать эту пластинку».</p>');
  bindCards($("#mine"));
}

// ===== UI =====
function openSheet(h){ $("#sbody").innerHTML=h; $("#sheet").classList.remove("hide"); document.body.style.overflow="hidden"; }
function closeSheet(){ $("#sheet").classList.add("hide"); document.body.style.overflow=""; }
$("#sheet").onclick = e=>{ if(e.target.id==="sheet") closeSheet(); };
function show(v){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("hide",s.id!=="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="market") renderMarket(); if(v==="mine") renderMine();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("#sf").onsubmit = e=>{ e.preventDefault(); search(); };
$("#ftog").onclick = ()=>$("#flt").classList.toggle("hide");
["mq","pmin","pmax","ymin","ymax","fcond","fcity","fgen","fsort"].forEach(i=>$("#"+i).addEventListener("input",renderMarket));
$("#fcond").innerHTML = '<option value="">Любое</option>'+COND.map(c=>`<option>${c}</option>`).join("");
$("#savetok").onclick = ()=>{ const t=$("#tok").value.trim(); if(!t) return; token=t; store.set("dgtoken",t); $("#tok").value=""; alert("Токен сохранён."); show("search"); };
$("#deltok").onclick = ()=>{ token=""; store.del("dgtoken"); alert("Токен удалён."); };

(async()=>{
  token = (await store.get("dgtoken"))||"";
  try{ mine = JSON.parse((await store.get("mine"))||"[]"); }catch(e){ mine=[]; }
  await loadAll();
  if(!token){ show("mine"); document.querySelector("details").open = true; $("#tok").focus(); }
})();
</script>
</body>
</html>
